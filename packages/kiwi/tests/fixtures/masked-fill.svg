<svg xmlns="http://www.w3.org/2000/svg" width="200" height="160" viewBox="0 0 200 160">
  <defs>
    <mask id="fade-mask">
      <rect x="10" y="10" width="180" height="100" fill="#ffffff" />
      <circle cx="160" cy="60" r="45" fill="#000000" />
    </mask>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <g mask="url(#fade-mask)">
    <rect x="0" y="0" width="200" height="120" fill="#7c3aed" />
  </g>
  <rect x="30" y="100" width="140" height="40" rx="8" fill="#0ea5e9" filter="url(#soft-shadow)" opacity="0.85" style="mix-blend-mode: multiply" />
</svg>
